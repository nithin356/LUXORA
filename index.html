<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Luxora | Bengaluru's Premier Luxury Ecosystem</title>
    <meta name="theme-color" content="#0A0A0A" />
    <meta
      name="description"
      content="Bengaluru's elite gateway to luxury cars, private aviation, yachting, and majestic estates. Experience the gold standard of luxury services."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/x-icon" href="/logo_Lg.png">
    <link rel="shortcut icon" href="/logo_Lg.png">
    <link rel="apple-touch-icon" href="/logo_Lg.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&family=Syncopate:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              luxora: {
                gold: "#D4AF37",
                goldLight: "#F3E5AB",
                dark: "#0A0A0A",
                charcoal: "#1A1A1A",
                bronze: "#CD7F32",
              },
            },
            fontFamily: {
              serif: ["Syne", "sans-serif"],
              sans: ["Outfit", "sans-serif"],
              futuristic: ["Syncopate", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0a0a0a;
        color: #ffffff;
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
      }
      .gold-gradient {
        background: linear-gradient(
          135deg,
          #d4af37 0%,
          #f3e5ab 50%,
          #cd7f32 100%
        );
      }
      .gold-text {
        background: linear-gradient(
          135deg,
          #d4af37 0%,
          #f3e5ab 50%,
          #cd7f32 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #d4af37;
        border-radius: 10px;
      }

      /* Luxury Motion & Depth */
      @keyframes reveal-up {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .reveal {
        opacity: 0;
      }

      .reveal.active {
        animation: reveal-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .glass-card {
        background: rgba(26, 26, 26, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px border rgba(255, 255, 255, 0.05);
      }

      .glass-nav {
        background: rgba(10, 10, 10, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .gold-aura-hover {
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .gold-aura-hover:hover {
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
        border-color: rgba(212, 175, 55, 0.3);
        transform: translateY(-5px);
      }

      .stagger-1 { animation-delay: 0.1s; }
      .stagger-2 { animation-delay: 0.2s; }
      .stagger-3 { animation-delay: 0.3s; }
      .stagger-4 { animation-delay: 0.4s; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="font-sans antialiased custom-scrollbar">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
